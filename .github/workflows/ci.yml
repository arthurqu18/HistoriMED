name: CI/CD Pipeline - HistoriMED

on:
  push:
    branches: [ main, master, main_b ]
  pull_request:
    branches: [ main, master, main_b ]

jobs:
  test-backend:
    name: Backend Unit Tests & Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependências do Backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx pytest-mock

    - name: Executar testes de unidade e mensurar cobertura (Python)
      run: |
        python -m pytest --ignore=tests/test_e2e.py --cov=backend --cov-report=term-missing --cov-fail-under=80
      env:
        PYTHONPATH: .

  test-e2e:
    name: End-to-End Browser Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependências e Chromium (Playwright)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx playwright
        python -m playwright install --with-deps chromium

    - name: Executar testes End-to-End no navegador
      run: |
        python -m pytest tests/test_e2e.py -v
      env:
        PYTHONPATH: .